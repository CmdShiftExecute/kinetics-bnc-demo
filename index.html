<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F4F0" />
    <script>
      try {
        var theme = localStorage.getItem('halvard-pis-theme');
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme : 'parchment';
      } catch { document.documentElement.dataset.theme = 'parchment'; }
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Halvard Project Intelligence System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
